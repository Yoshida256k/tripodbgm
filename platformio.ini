; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; game：本番用（PLC信号で場面を判定して音を鳴らす）  src/game/
; test：回路の動作確認用（シリアルメニュー0〜6）    src/test/
[platformio]
default_envs = game

; 標準のraspberrypiプラットフォームはmbedコアでI2Sが使えないため、
; maxgerhardt版を使ってearlephilhower（arduino-pico）コアにする
[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = vccgnd_yd_rp2040
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel
    marcoschwartz/LiquidCrystal_I2C
    earlephilhower/BackgroundAudio

; 16MBのうち後ろの12MBを音源の置き場（LittleFS）にする。GUIから転送したMP3と設定を入れる。
; testは2MBあるので、置き場を4MB以降にしてtestを書き込んでも音源が消えないようにしている
[env:game]
build_src_filter = +<game/>
board_build.filesystem_size = 12m
; MP3を2本同時にデコードするとCPUが足りないので、200MHzにして最適化も速さ優先にする
board_build.f_cpu = 200000000L
build_unflags = -Os
build_flags = -O2
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.0.0

[env:test]
build_src_filter = +<test/>
